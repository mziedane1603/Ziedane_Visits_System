    --sky-mid:#5c1f3a;
    --sky-low:#a8471f;
    --sun:#e8942f;
    --sun-light:#ffca7a;
    --parchment:#2b1a16;
    --parchment-2:#33201a;
    --ink:#f3e3cf;
    --ink-soft:#cba883;
    --line:#7a4a2a;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Cairo', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 55% at 50% 100%, var(--sun) 0%, transparent 60%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-low) 100%);
    background-attachment:fixed;
    min-height:100vh;
    overflow-x:hidden;
  }

  .sun-disc{
    position:fixed;
    left:50%; bottom:-8vh;
    width:70vw; max-width:420px; aspect-ratio:1/1;
    transform:translateX(-50%);
    background:radial-gradient(circle at 50% 40%, var(--sun-light) 0%, var(--sun) 55%, transparent 72%);
    filter:blur(2px);
    opacity:.55;
    z-index:0;
    pointer-events:none;
  }

  header{
    position:sticky; top:0; z-index:20;
    padding:18px 18px 10px;
    text-align:center;
    background:linear-gradient(180deg, rgba(24,11,25,.85), rgba(24,11,25,0));
    backdrop-filter:blur(2px);
  }
  header h1{
    margin:0;
    font-size:1.35rem;
    font-weight:800;
    color:var(--sun-light);
    letter-spacing:.5px;
  }
  header p{
    margin:4px 0 0;
    font-size:.8rem;
    color:var(--parchment-2);
    opacity:.85;
  }

  nav{
    position:sticky; top:62px; z-index:19;
    display:flex; gap:8px;
    overflow-x:auto;
    padding:10px 14px 14px;
    scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none;}
  nav button{
    flex:0 0 auto;
    font-family:'Cairo', sans-serif;
    font-size:.85rem;
    font-weight:600;
    color:var(--parchment);
    background:rgba(251,234,210,.12);
    border:1px solid rgba(251,234,210,.35);
    border-radius:999px;
    padding:9px 16px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease, transform .15s ease;
    white-space:nowrap;
  }
  nav button.active{
    background:var(--sun);
    border-color:var(--sun);
    color:#2a1330;
    transform:translateY(-1px);
  }

  main{
    position:relative;
    z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:6px 16px 60px;
  }

  section{ display:none; }
  section.active{ display:block; animation:rise .35s ease; }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .intro{
    text-align:center;
    color:var(--parchment);
    font-size:.9rem;
    margin:4px 4px 12px;
    opacity:.9;
    line-height:1.7;
  }

  .section-tools{
    display:flex;
    justify-content:center;
    margin-bottom:16px;
  }
  .section-tools button{
    font-family:'Cairo', sans-serif;
    font-size:.78rem;
    font-weight:700;
    color:var(--parchment);
    background:rgba(251,234,210,.1);
    border:1px solid rgba(251,234,210,.35);
    border-radius:999px;
    padding:7px 16px;
    cursor:pointer;
  }

  .card{
    background:linear-gradient(180deg, var(--parchment), var(--parchment-2));
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px 18px;
    margin-bottom:16px;
    box-shadow:var(--card-shadow);
    position:relative;
  }
  .card::before{
    content:"";
    position:absolute; inset:6px;
    border:1px solid rgba(200,90,46,.25);
    border-radius:12px;
    pointer-events:none;
  }
  .card .ref{
    font-size:.78rem;
    font-weight:700;
    color:var(--sky-low);
    background:rgba(200,90,46,.12);
    display:inline-block;
    padding:3px 12px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .verse{
    font-family:'Amiri Quran', serif;
    font-size:1.5rem;
    line-height:2.5;
    text-align:center;
    color:var(--ink);
  }

  .dhikr-item{
    background:linear-gradient(180deg, var(--parchment), var(--parchment-2));
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 16px 16px;
    margin-bottom:12px;
    box-shadow:0 6px 18px rgba(42,19,48,.16);
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    transition:border-color .2s ease, transform .1s ease, opacity .2s ease;
  }
  .dhikr-item:active{ transform:scale(.985); }
  .dhikr-item.done{
    border-color:var(--ok);
  }
  .dhikr-item .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    gap:10px;
  }
  .dhikr-item .num{
    font-size:.78rem;
    color:var(--ink-soft);
    font-weight:600;
  }
  .dhikr-item .note{
    font-size:.78rem;
    color:var(--ink-soft);
    font-weight:700;
    margin-bottom:6px;
  }
  .dhikr-item .txt{
    font-family:'Amiri Quran', serif;
    font-size:1.18rem;
    line-height:2.15;
    color:var(--ink);
    text-align:right;
  }

  .item-counter{
    display:flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
  }
  .item-counter .ring{
    position:relative;
    width:42px; height:42px;
    flex:0 0 auto;
  }
  .item-counter svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .item-counter circle{ fill:none; stroke-width:5; }
  .item-counter .bg{ stroke:rgba(58,33,21,.15); }
  .item-counter .fg{ stroke:var(--sky-low); stroke-linecap:round; transition:stroke-dashoffset .25s ease, stroke .25s ease; }
  .dhikr-item.done .item-counter .fg{ stroke:var(--ok); }
  .item-counter .ring-num{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:.68rem;
    font-weight:800;
    color:var(--ink);
  }
  .item-counter .target-lbl{
    font-size:.72rem;
    font-weight:700;
    color:var(--sky-low);
    white-space:nowrap;
  }
  .dhikr-item.done .item-counter .target-lbl{ color:var(--ok); }
  .tap-hint{
    text-align:center;
    color:var(--ink-soft);
    font-size:.68rem;
    margin-top:6px;
    opacity:.7;
  }

  .streak-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:16px;
  }
  .streak-box{
    background:linear-gradient(180deg, var(--parchment), var(--parchment-2));
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 18px;
    text-align:center;
    box-shadow:0 6px 16px rgba(42,19,48,.16);
  }
  .streak-box .val{ font-size:1.3rem; font-weight:800; color:var(--sky-low); }
  .streak-box .lbl{ font-size:.7rem; color:var(--ink-soft); font-weight:700; margin-top:2px; }

  .challenge-progress{
    height:8px;
    border-radius:999px;
    background:rgba(251,234,210,.25);
    overflow:hidden;
    margin:0 4px 18px;
  }
  .challenge-progress .fill{
    height:100%;
    background:linear-gradient(90deg, var(--sun), var(--sky-low));
    width:0%;
    transition:width .3s ease;
  }

  .task-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:linear-gradient(180deg, var(--parchment), var(--parchment-2));
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    transition:border-color .2s ease, transform .1s ease;
  }
  .task-item:active{ transform:scale(.985); }
  .task-item.done{ border-color:var(--ok); }
  .task-item .check{
    flex:0 0 auto;
    width:26px; height:26px;
    border-radius:50%;
    border:2px solid var(--sky-low);
    display:flex; align-items:center; justify-content:center;
    font-size:.85rem;
    color:transparent;
    transition:background .2s ease, border-color .2s ease, color .2s ease;
  }
  .task-item.done .check{
    background:var(--ok);
    border-color:var(--ok);
    color:#fff;
  }
  .task-item .task-label{
    font-size:.98rem;
    font-weight:600;
    color:var(--ink);
  }
  .task-item.done .task-label{
    color:var(--ink-soft);
    text-decoration:line-through;
  }

  .counter-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:10px 0 24px;
  }
  .counter-ring{
    position:relative;
    width:230px; height:230px;
    margin:10px 0 22px;
  }
  .counter-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .counter-ring circle{ fill:none; stroke-width:14; }
  .ring-bg{ stroke:rgba(251,234,210,.25); }
  .ring-fg{ stroke:var(--sun); stroke-linecap:round; transition:stroke-dashoffset .3s ease; }
  .counter-btn{
    position:absolute; inset:0;
    margin:auto;
    width:172px; height:172px;
    border-radius:50%;
    border:none;
    background:radial-gradient(circle at 40% 35%, var(--sun-light), var(--sun) 65%, var(--sky-low));
    color:#2a1330;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 8px 26px rgba(200,90,46,.45), inset 0 -6px 18px rgba(42,19,48,.15);
    transition:transform .12s ease;
    top:29px; left:0; right:0; bottom:0;
  }
  .counter-btn:active{ transform:scale(.94); }
  .counter-btn .num{ font-size:3rem; font-weight:800; line-height:1; }
  .counter-btn .lbl{ font-size:.85rem; font-weight:700; margin-top:6px; opacity:.85; }
  .counter-target{ color:var(--parchment); font-size:.85rem; margin-bottom:14px; opacity:.85; }
  .counter-actions{ display:flex; gap:10px; }
  .counter-actions button{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:.85rem;
    padding:10px 18px;
    border-radius:999px;
    border:1px solid rgba(251,234,210,.4);
    background:rgba(251,234,210,.1);
    color:var(--parchment);
    cursor:pointer;
  }
  .counter-actions button.reset{
    color:#ffd9c2;
    border-color:rgba(255,143,90,.5);
    background:rgba(200,90,46,.18);
  }
  .counter-hint{
    text-align:center;
    color:var(--parchment-2);
    font-size:.78rem;
    margin-top:16px;
    opacity:.75;
    line-height:1.7;
    max-width:320px;
  }

  footer{
    text-align:center;
    color:var(--parchment-2);
    font-size:.75rem;
    opacity:.6;
    padding:20px 20px 10px;
    position:relative; z-index:1;
  }

  @media (max-width:360px){
    .verse{ font-size:1.3rem; }
    .counter-ring{ width:200px; height:200px; }
    .counter-btn{ width:150px; height:150px; }
  }

  @media (prefers-reduced-motion: reduce){
    section.active{ animation:none; }
    .counter-btn{ transition:none; }
  }

  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  header{ top:env(safe-area-inset-top,0px) !important; padding:12px 18px 8px !important; display:flex; align-items:center; justify-content:center; gap:12px; text-align:right !important; }
  nav{ top:calc(72px + env(safe-area-inset-top,0px)) !important; }
  .brand-logo{ width:48px; height:48px; border-radius:14px; border:2px solid var(--sun); box-shadow:0 4px 14px rgba(0,0,0,.35); background:#efeade; flex:0 0 auto; object-fit:cover; }
  .brand-text{ text-align:right; }
  .brand-text h1{ font-size:1.2rem !important; }
  .brand-text p{ margin:2px 0 0 !important; font-size:.72rem !important; }

  #splash{ position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(120% 55% at 50% 100%, var(--sun) 0%, transparent 60%), linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 50%, var(--sky-low) 100%);
    transition:opacity .5s ease, visibility .5s ease; }
  #splash.hide{ opacity:0; visibility:hidden; }
  #splash img{ width:150px; height:150px; border-radius:36px; border:3px solid var(--sun-light); box-shadow:0 14px 40px rgba(0,0,0,.4); animation:pop .7s ease both; }
  #splash h2{ margin:0; color:var(--sun-light); font-size:1.5rem; font-weight:800; }
  #splash p{ margin:0; color:var(--parchment-2); font-size:.85rem; opacity:.85; }
  @keyframes pop{ from{ opacity:0; transform:scale(.85); } to{ opacity:1; transform:scale(1); } }

  #installBar{ position:relative; z-index:2; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin:0 16px 6px; padding:9px 14px; border-radius:14px; background:rgba(251,234,210,.14); border:1px solid rgba(251,234,210,.35); color:var(--parchment); font-size:.8rem; }
  #installBar[hidden]{ display:none; }
  #installBar button{ font-family:'Cairo',sans-serif; font-weight:700; font-size:.8rem; border-radius:999px; border:none; padding:7px 16px; cursor:pointer; background:var(--sun); color:#2a1330; }
  #installBar .x{ background:transparent; color:var(--parchment); border:1px solid rgba(251,234,210,.4); padding:6px 12px; }
  @media (prefers-reduced-motion: reduce){ #splash img{ animation:none; } #splash{ transition:none; } }
</style>
</head>
<body>

<div id="splash">
  <img id="splashLogo" alt="شعار التطبيق">
  <h2>ورد المساء والصباح</h2>
  <p>حصنك اليومي من الأذكار</p>
</div>

<div class="sun-disc"></div>

<header>
  <img id="hdrLogo" class="brand-logo" alt="شعار التطبيق">
  <div class="brand-text">
    <h1>ورد المساء والصباح</h1>
    <p>أذكار · قرآن · استغفار · تحديات</p>
  </div>
</header>

<nav id="tabs"></nav>

<div id="installBar" hidden></div>

<main id="sections"></main>

<footer>اللهم اجعله علماً ينفعنا وذكراً يقربنا إليك</footer>

(function splash(){
  const el = document.getElementById('splash');
  if(window.self !== window.top){ el.classList.add('hide'); return; }   // مفتوح جوه التطبيق: من غير شاشة افتتاحية
  let seen = false;
  try{ seen = sessionStorage.getItem('splash-seen') === '1'; }catch(e){}
  if(seen){ el.classList.add('hide'); return; }
  setTimeout(()=>{
    el.classList.add('hide');
    try{ sessionStorage.setItem('splash-seen','1'); }catch(e){}
  }, 1500);
})();



(function installPrompt(){
  if(window.self !== window.top) return;   // التثبيت من التطبيق الأساسي
  const bar = document.getElementById('installBar');
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let dismissed = false;
  try{ dismissed = localStorage.getItem('install-dismissed') === '1'; }catch(e){}
  if(standalone || dismissed) return;
  let deferred = null;
  function close(){ bar.hidden = true; try{ localStorage.setItem('install-dismissed','1'); }catch(e){} }
  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault(); deferred = e;
    bar.innerHTML = '<span>📲 ثبّت التطبيق على شاشتك الرئيسية</span><button id="doInstall">تثبيت</button><button class="x" id="noInstall">لاحقًا</button>';
    bar.hidden = false;
    document.getElementById('doInstall').onclick = async ()=>{ deferred.prompt(); await deferred.userChoice; bar.hidden = true; };
    document.getElementById('noInstall').onclick = close;
  });
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    bar.innerHTML = '<span>📲 لتثبيت التطبيق: اضغط زر المشاركة ثم "إضافة إلى الشاشة الرئيسية"</span><button class="x" id="noInstall">تمام</button>';
    bar.hidden = false;
    document.getElementById('noInstall').onclick = close;
  }
})();

function verseSectionHTML(key){
  const d = DATA[key];
  let html = `<div class="intro">${d.intro}</div>`;
  d.verses.forEach(v=>{
    html += `<div class="card"><span class="ref">${v.ref}</span><div class="verse">${v.text}</div></div>`;
  });
  return html;

function dhikrItemHTML(section, idx, item){
  const id = section + '-' + idx;
  return `<div class="dhikr-item" data-section="${section}" data-idx="${idx}" data-target="${item.target}" id="item-${id}">
    <div class="top-row">
      <span class="num">${idx+1}</span>
      <div class="item-counter">
        <span class="target-lbl" id="lbl-${id}">0 / ${item.target}</span>
        <span class="ring">
          <svg viewBox="0 0 44 44">
            <circle class="bg" cx="22" cy="22" r="${RING_R}"></circle>
            <circle class="fg" id="ring-${id}" cx="22" cy="22" r="${RING_R}"></circle>
          </svg>
          <span class="ring-num" id="num-${id}">0</span>
        </span>
      </div>
    </div>
    ${item.note ? `<div class="note">${item.note}</div>` : ""}
    <div class="txt">${item.text}</div>
  </div>`;
}

function dhikrSectionHTML(section, list, introText){
  let html = `<div class="intro">${introText}</div>
  <div class="section-tools"><button class="section-reset" data-section="${section}">إعادة ضبط عدّاد اليوم</button></div>`;
  list.forEach((item, i)=>{ html += dhikrItemHTML(section, i, item); });
  html += `<div class="tap-hint">اضغط على أي ذكر لعدّ مرة واحدة</div>`;
  return html;
}

  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
  if(id === 'istighfar') initCounterUI();
  if(id === 'challenges') initChallengesUI();
}

/* ---- shared date stamp ---- */
function dateStamp(){
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

/* ---- per-item dhikr counters ---- */
function dhikrStorageKey(section, idx){
  return 'dhikr-' + section + '-' + idx + '-' + dateStamp();
}

function loadDhikrCount(section, idx){
  try{
    const v = localStorage.getItem(dhikrStorageKey(section, idx));
    return v ? parseInt(v, 10) : 0;
  }catch(e){ return 0; }
}

function saveDhikrCount(section, idx, val){
  try{ localStorage.setItem(dhikrStorageKey(section, idx), String(val)); }catch(e){}
}

function renderDhikrItem(section, idx, target, count){
  const id = section + '-' + idx;
  const ring = document.getElementById('ring-' + id);
  const numEl = document.getElementById('num-' + id);
  const lblEl = document.getElementById('lbl-' + id);
  const card = document.getElementById('item-' + id);
  if(!ring || !numEl || !lblEl || !card) return;
  if(!ring.dataset.setup){
    ring.style.strokeDasharray = RING_CIRC;
    ring.dataset.setup = "1";
  }
  const progress = Math.min(count / target, 1);
  ring.style.strokeDashoffset = RING_CIRC * (1 - progress);
  numEl.textContent = count;
  lblEl.textContent = count + ' / ' + target;
  card.classList.toggle('done', count >= target);
}

function initDhikrCounters(){
  document.querySelectorAll('.dhikr-item').forEach(card=>{
    const section = card.dataset.section;
    const idx = parseInt(card.dataset.idx, 10);
    const target = parseInt(card.dataset.target, 10);
    const count = loadDhikrCount(section, idx);
    renderDhikrItem(section, idx, target, count);
    if(!card.dataset.bound){
      card.dataset.bound = "1";
      card.addEventListener('click', ()=>{
        let c = loadDhikrCount(section, idx);
        c = (c >= target) ? 0 : c + 1;
        saveDhikrCount(section, idx, c);
        renderDhikrItem(section, idx, target, c);
        if(navigator.vibrate){ navigator.vibrate(10); }
      });
    }
  });
  document.querySelectorAll('.section-reset').forEach(btn=>{
    if(btn.dataset.bound) return;
    btn.dataset.bound = "1";
    btn.addEventListener('click', ()=>{
      const section = btn.dataset.section;
      document.querySelectorAll(`.dhikr-item[data-section="${section}"]`).forEach(card=>{
        const idx = parseInt(card.dataset.idx, 10);
        const target = parseInt(card.dataset.target, 10);
        saveDhikrCount(section, idx, 0);
        renderDhikrItem(section, idx, target, 0);
      });
    });
  });
}
initDhikrCounters();

/* ---- Daily challenges / streak ---- */
function taskKey(id){ return 'task-' + id + '-' + dateStamp(); }

function loadTaskDone(id){
  try{ return localStorage.getItem(taskKey(id)) === '1'; }catch(e){ return false; }
}
function saveTaskDone(id, val){
  try{ localStorage.setItem(taskKey(id), val ? '1' : '0'); }catch(e){}
}
function loadStreak(){
  try{ return parseInt(localStorage.getItem('challenge-streak') || '0', 10); }catch(e){ return 0; }
}
function saveStreak(n){ try{ localStorage.setItem('challenge-streak', String(n)); }catch(e){} }
function loadStreakLastDate(){
  try{ return localStorage.getItem('challenge-streak-last') || ''; }catch(e){ return ''; }
}
function saveStreakLastDate(v){ try{ localStorage.setItem('challenge-streak-last', v); }catch(e){} }

function yesterdayStamp(){
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

function buildTaskList(){
  const wrap = document.getElementById('taskList');
  if(!wrap) return;
  wrap.innerHTML = '';
  CHALLENGE_TASKS.forEach(t=>{
    const div = document.createElement('div');
    div.className = 'task-item';
    div.dataset.id = t.id;
    div.innerHTML = `<span class="check">✓</span><span class="task-label">${t.label}</span>`;
    div.addEventListener('click', ()=>{
      const done = !loadTaskDone(t.id);
      saveTaskDone(t.id, done);
      renderChallenges();
    });
    wrap.appendChild(div);
  });
}

function renderChallenges(){
  const streakVal = document.getElementById('streakVal');
  const taskDoneVal = document.getElementById('taskDoneVal');
  const fill = document.getElementById('challengeFill');
  if(!streakVal) return;

  let doneCount = 0;
  document.querySelectorAll('.task-item').forEach(el=>{
    const done = loadTaskDone(el.dataset.id);
    el.classList.toggle('done', done);
    if(done) doneCount++;
  });

  taskDoneVal.textContent = doneCount + '/' + CHALLENGE_TASKS.length;
  fill.style.width = Math.round((doneCount / CHALLENGE_TASKS.length) * 100) + '%';

  const today = dateStamp();
  const lastDate = loadStreakLastDate();
  let streak = loadStreak();

  if(doneCount === CHALLENGE_TASKS.length){
    if(lastDate !== today){
      streak = (lastDate === yesterdayStamp()) ? streak + 1 : 1;
      saveStreak(streak);
      saveStreakLastDate(today);
    }
  } else if(lastDate === today){
    streak = Math.max(0, streak - 1);
    saveStreak(streak);
    saveStreakLastDate(yesterdayStamp());
  }

  streakVal.textContent = streak;
}

function initChallengesUI(){
  if(!document.getElementById('taskList').dataset.built){
    buildTaskList();
    document.getElementById('taskList').dataset.built = '1';
  }
  renderChallenges();
}

/* ---- Istighfar counter logic ---- */
const TARGET = 100;
const CIRC = 2 * Math.PI * 100;

function todayKey(){ return 'istighfar-' + dateStamp(); }

function loadCount(){
  try{
    const v = localStorage.getItem(todayKey());
    return v ? parseInt(v, 10) : 0;
  }catch(e){ return 0; }
}
function saveCount(n){ try{ localStorage.setItem(todayKey(), String(n)); }catch(e){} }

let count = 0;
let ringReady = false;

function initCounterUI(){
  count = loadCount();
  const ring = document.getElementById('ringFg');
  if(ring && !ringReady){
    ring.style.strokeDasharray = CIRC;
    ringReady = true;
  }
  renderCounter();
  const btn = document.getElementById('counterBtn');
  const resetBtn = document.getElementById('counterReset');
  if(btn && !btn.dataset.bound){
    btn.dataset.bound = "1";
    btn.addEventListener('click', ()=>{
      count += 1;
      saveCount(count);
      renderCounter();
      if(navigator.vibrate){ navigator.vibrate(12); }
    });
  }
  if(resetBtn && !resetBtn.dataset.bound){
    resetBtn.dataset.bound = "1";
    resetBtn.addEventListener('click', ()=>{
      count = 0;
      saveCount(count);
      renderCounter();
    });
  }
}

function renderCounter(){
  const numEl = document.getElementById('counterNum');
  const ring = document.getElementById('ringFg');
  if(!numEl || !ring) return;
  numEl.textContent = count;
  const progress = Math.min(count / TARGET, 1);
  ring.style.strokeDashoffset = CIRC * (1 - progress);
}

initCounterUI();
</script>
